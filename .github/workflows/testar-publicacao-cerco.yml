            await page.screenshot({path:'/tmp/cerco-loja-mobile.png'});
            assert.deepEqual(problems,[]);
            const demoContext=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:1,recordVideo:{dir:'/tmp/cerco-recording',size:{width:390,height:844}}});
            const demo=await demoContext.newPage();
            await demo.goto('http://127.0.0.1:8080/?test=1',{waitUntil:'networkidle'});
            await demo.waitForFunction(()=>window.Cerco3D?.ready===true,{timeout:20000});
            await demo.locator('#homePlay').click();
            const lineup=await demo.evaluate(()=>window.__cercoTest.modelLineup());
            assert.equal(lineup.length,8);
            assert.ok(lineup.find(m=>m.kind==='colosso').height>lineup.find(m=>m.kind==='soldado').height*1.4);
            assert.ok(lineup.find(m=>m.kind==='soldado').height>1);
            await demo.screenshot({path:'/tmp/cerco-identidade-3d.png'});
            await demo.evaluate(()=>{window.__cercoTest.reset()});
            await demo.locator('#start').click();
            await demo.evaluate(()=>{window.__cercoTest.duel('guardiao');window.__cercoTest.createEnemy('arqueiro',105,245)});
            await demo.waitForTimeout(7500);
            await demo.screenshot({path:'/tmp/cerco-personagens-3d.png'});
            const video=demo.video();await demoContext.close();
            require('node:fs').copyFileSync(await video.path(),'/tmp/cerco-batalha-3d.webm');
            await browser.close();
            console.log('PASSOU: lobby de jogo, skins à venda para todos, pergaminhos, combate 3D, controles Android e sem erros JS');
          })().catch(e=>{console.error(e);process.exit(1)});
