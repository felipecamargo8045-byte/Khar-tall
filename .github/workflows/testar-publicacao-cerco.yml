name: Testar as seis telas do Cerco dos Reis
on:
  push:
    branches: [cerco-dos-reis-migracao-2026-10, cerco-liliti-cartas-20261031]
    paths:
      - 'cerco-dos-reis/**'
      - 'cerco-commerce/**'
      - '.github/workflows/testar-publicacao-cerco.yml'
  workflow_dispatch:
jobs:
  testar-jogo:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cerco_test
          POSTGRES_PASSWORD: cerco_test_local
          POSTGRES_DB: cerco_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cerco_test -d cerco_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Validar scripts e estrutura das telas
        run: |
          set -e
          node --check cerco-dos-reis/app.js
          node --check cerco-dos-reis/rewards.js
          node --check cerco-dos-reis/home.js
          node --check cerco-dos-reis/sfx.js
          node --check cerco-dos-reis/voices.js
          node --check cerco-dos-reis/khar-audio-original.js
          node --check cerco-dos-reis/restore-original-audio.js
          node --check cerco-dos-reis/realm-ui.js
          node --check cerco-dos-reis/sw.js
          node --check cerco-dos-reis/arena3d.js
          node --check cerco-dos-reis/character-models.js
          node --check cerco-dos-reis/arena-layout.js
          node --check cerco-dos-reis/arena-atmosphere.js
          node cerco-dos-reis/tests/presentation.mjs
          node --check cerco-dos-reis/character-cloth.js
          node --check cerco-dos-reis/store.js
          node --check cerco-dos-reis/card-art.js
          node cerco-dos-reis/tests/liliti.mjs
          node --check cerco-commerce/server.cjs
          node --test cerco-commerce/tests/provider.cjs
          python3 - <<'PY'
          from pathlib import Path
          html=Path('cerco-dos-reis/index.html').read_text()
          for tab in ['home','arena','cards','shop','clans','profile']:
              assert 'data-page="'+tab+'"' in html, tab
          for name in ['#shopGrid','#featuredCards','#cardGrid','#arena']:
              assert name[1:] in html, name
          assert 'https://cerco-dos-reis-app.felipecamargo8045.chatgpt.site/' not in html
          assert 'src="./app.js?v=29"' in html
          assert 'src="./rewards.js?v=3"' in html
          assert 'src="./home.js?v=5"' in html
          assert 'src="./voices.js?v=5"' in html
          assert 'src="./realm-ui.js?v=7"' in html
          assert 'href="./interface.css?v=50"' in html
          assert 'src="./arena3d.js?v=22"' in html
          for name in ['game-ui.css','interface.css','assets/interface-icons.svg','app.js','rewards.js','home.js','arena3d.js','arena-atmosphere.js','arena-layout.js','character-models.js','vendor/three.module.js','realm-ui.js','sw.js','sfx.js','voices.js','khar-audio-original.js','original-audio/sha256.json']:
              assert Path('cerco-dos-reis',name).is_file(),name
          print('Seis ambientes, recompensas, arquivos, navegacao e scripts: OK')
          PY
      - name: Testar compra, entrega e reembolso da Liliti em banco isolado
        env:
          CERCO_TEST_DATABASE_URL: postgres://cerco_test:cerco_test_local@127.0.0.1:5432/cerco_test
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          node --test cerco-commerce/tests/integration.cjs
      - name: Instalar navegador de teste
        run: |
          npm install --prefix /tmp/cerco-tests --no-audit --no-fund playwright@1.56.1
          /tmp/cerco-tests/node_modules/.bin/playwright install chromium
      - name: Verificar navegacao, cartas, loja, arena e perfil no Android
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 --directory cerco-dos-reis > /tmp/cerco-http.log 2>&1 &
          node <<'JS'
          const { chromium } = require('/tmp/cerco-tests/node_modules/playwright');
          const assert = require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--enable-webgl','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
            const problems=[];
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
            // Motor TTS de teste: valida falas, perfis e controles independentemente
            // das vozes instaladas no runner. No Android real o sistema usa as vozes pt-BR do aparelho.
            await page.addInitScript(()=>{
              const realFetch=window.fetch.bind(window);
              window.fetch=(input,options)=>{
                const url=typeof input==='string'?input:input?.url;
                if(url==='https://cerco-dos-reis-loja.onrender.com/collection')return Promise.resolve(new Response(JSON.stringify({exists:true,owned:[],cards:window.__testOwnedCards||[],equipped:null,orders:[]}),{status:200,headers:{'Content-Type':'application/json'}}));
                return realFetch(input,options);
              };
              const synth={
                speaking:false,pending:false,cancel(){this.speaking=false},
                getVoices(){return [{name:'Português Brasil 1',lang:'pt-BR',default:true},
                  {name:'Português Brasil 2',lang:'pt-BR',default:false}]},
                addEventListener(){},
                speak(utt){(window.__cercoVoiceCalls??=[]).push({
                  text:utt.text,pitch:utt.pitch,rate:utt.rate,lang:utt.lang,voice:utt.voice?.name||''
                });}
              };
              try{Object.defineProperty(window,'speechSynthesis',{configurable:true,value:synth})}catch{window.speechSynthesis=synth}
              window.SpeechSynthesisUtterance=class SpeechSynthesisUtterance{constructor(text){this.text=text}};
            });
            page.on('pageerror',e=>problems.push('js: '+String(e)));
            page.on('console',message=>{
              if(message.type()==='error'&&/THREE\.|WebGL|shader/i.test(message.text()))problems.push('3D: '+message.text());
            });
            await page.goto('http://127.0.0.1:8080/?test=1',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>window.Cerco3D?.ready===true,{timeout:20000});
            const threeInfo=await page.evaluate(()=>window.Cerco3D.info());
            assert.ok(threeInfo.ready && threeInfo.meshes>30,'3D real nao iniciado: '+JSON.stringify(threeInfo));
            assert.ok(threeInfo.presentation.shadows&&threeInfo.presentation.environment,'Iluminação e sombras indisponíveis');
            assert.ok(threeInfo.presentation.drawCalls<1500,'Orçamento de renderização excedido: '+JSON.stringify(threeInfo));
            assert.equal(await page.locator('#sceneBadge').innerText(),'3D ATIVO');
            // Tela de entrada deve ser uma página própria com economia local.
            assert.equal(await page.locator('.page.active').getAttribute('data-page'),'home');
            for(const id of ['homeLevel','homeWins','homeScrolls','homeOpened','homeMaterials',
              'homeOpenScroll','homePremiumSkins','homeHistory','homePlay']){
              assert.ok(await page.locator('#'+id).count(),'Campo da tela inicial ausente: '+id);
            }
            assert.equal(await page.locator('#homeScrolls').innerText(),'0');
            const lobbyRect=await page.evaluate(()=>{
              const shell=document.querySelector('.lobby-shell').getBoundingClientRect(),
                    nav=document.querySelector('#navigation').getBoundingClientRect(),
                    battle=document.querySelector('#homePlay').getBoundingClientRect(),
                    header=getComputedStyle(document.querySelector('.game-header'));
              return {shell:{w:shell.width,h:shell.height},nav:{top:nav.top,bottom:nav.bottom},
                battle:{w:battle.width,h:battle.height,bottom:battle.bottom},
                screen:{w:innerWidth,h:innerHeight},header:header.display};
            });
            assert.equal(lobbyRect.header,'none','Lobby ainda exibe cabeçalho de site');
            assert.ok(lobbyRect.shell.w>=lobbyRect.screen.w-2,'Lobby não ocupa toda a largura');
            assert.ok(lobbyRect.nav.top>lobbyRect.screen.h*.8,'Navegação não está na parte inferior');
            assert.ok(lobbyRect.battle.w>190&&lobbyRect.battle.h>=50,'Botão Batalhar não é dominante');
            await page.locator('#lobbyOpenScroll').click();
            assert.ok(await page.locator('#lobbyDrawer').isVisible(),'Menu de pergaminhos não abriu');
            assert.ok(await page.locator('#lobbyScrollPanel').isVisible(),'Pergaminhos ausentes do menu');
            await page.locator('#lobbyDrawerClose').click();
            await page.locator('#lobbySkins').click();
            assert.ok(await page.locator('#lobbySkinsPanel').isVisible(),'Menu de skins não abriu');
            assert.equal(await page.locator('.home-skin-buy').count(),8,'Catálogo de skins ausente no lobby');
            assert.equal(await page.locator('.home-skin-buy').first().getAttribute('href'),
              '#shop','Skin não comprável por todos');
            await page.locator('#lobbyDrawerClose').click();

            await page.screenshot({path:'/tmp/cerco-home-mobile.png',fullPage:true});
            assert.ok(await page.locator('#homeOpenScroll').isDisabled(),'Pergaminho aberto sem vitória');
            const rewardsInitial=await page.evaluate(()=>window.CercoRewards.snapshot());
            assert.equal(rewardsInitial.level,1,'O novo comandante deveria começar no nível 1');
            assert.equal(rewardsInitial.scrolls,0,'Há pergaminho inicial não conquistado');
            const sounds=await page.evaluate(()=>window.CercoAudio?.getSettings());
            assert.ok(sounds && typeof sounds.volume==='number','Audio local nao inicializou');
            // Dublagem real: não depender da fala genérica do Android.
            // Cada arquivo OGG foi gerado com Kokoro pt-BR e mixagem própria.
            await page.waitForFunction(()=>window.CercoVoices?.status().loaded>=29,{timeout:45000});
            const voiceAudit=await page.evaluate(async()=>{
              const engine=window.CercoVoices;
              const response=await fetch('/voice-pack/manifest.json');
              const manifest=await response.json();
              const voices=engine.status(),profiles=engine.profiles;
              const clips=[];
              for(const [id,cast] of Object.entries(manifest.characters)){
                for(const [event,files] of Object.entries(cast.clips||{})){
                  for(const file of files)clips.push({id,event,file});
                }
              }
              return {voices,profiles,manifest,clips};
            });
            assert.ok(voiceAudit.voices.recorded,'Pacote pré-gravado não ativado');
            assert.equal(voiceAudit.voices.fallbackSpeechSynthesis,false,'Voz genérica do Android ainda é usada');
            assert.ok(voiceAudit.voices.loaded>=29,'29 novas gravações de personagens não foram carregadas');
            assert.equal(voiceAudit.manifest.version,2,'Pacote antigo de áudio; nitidez não atualizada');
            assert.equal(Object.keys(voiceAudit.profiles).length,8,'Todos os personagens precisam ter identidade vocal');
            assert.equal(Object.keys(voiceAudit.manifest.characters).length,7,'Sete classes com voz humana devem ter gravações');
            assert.ok(voiceAudit.profiles.lobo.lines.length===0,'Lobo não pode receber fala humana');
            assert.equal(voiceAudit.clips.length,29,'Número incorreto de falas gravadas');
            assert.ok(voiceAudit.manifest.characters.rei.dialogue.attack.some(t=>t.includes('irmãos')),'O Rei não menciona a guerra dos irmãos');
            assert.ok(voiceAudit.manifest.characters.guardiao.dialogue.attack.some(t=>t.includes('juramento')),'Guardião sem referência ao juramento');
            assert.ok(voiceAudit.manifest.characters.batedor.dialogue.attack.some(t=>t.includes('marca')),'Batedor sem referência à marca');
            assert.ok(voiceAudit.manifest.characters.liliti.dialogue.attack.some(t=>t.includes('história')),'Liliti sem referência ao passado');
            const unique=new Set(Object.entries(voiceAudit.manifest.characters).map(([id,c])=>c.style));
            assert.equal(unique.size,7,'Personagens não têm direção vocal única');
            assert.ok(voiceAudit.clips.every(c=>c.file.endsWith('.ogg')),'Formato da dublagem não é OGG');
            // A ativação precisa partir de um clique real no navegador, como no jogo.
            await page.locator('#lobbyVoice').click();
            assert.equal(await page.evaluate(()=>window.CercoVoices.enabled()),false,'Falha ao silenciar dublagem');
            await page.locator('#lobbyVoice').click();
            assert.equal(await page.evaluate(()=>window.CercoVoices.enabled()),true,'Falha ao reativar dublagem');
            await page.waitForTimeout(160);
            const spoken=await page.evaluate(()=>{
              const played=window.CercoVoices.speak('arqueiro','summon');
              const latest=window.CercoVoices.history().at(-1);
              return {played,latest};
            });
            assert.equal(spoken.played,true,'Arqueiro não reproduziu a gravação');
            assert.equal(spoken.latest.id,'arqueiro','Personagem errado na reprodução');
            assert.ok(spoken.latest.file.endsWith('.ogg'),'Fala não usou arquivo de áudio gravado');
            await page.evaluate(()=>window.CercoVoices.stop());
            await page.locator('#lobbyVoice').click();
            assert.equal(await page.evaluate(()=>window.CercoVoices.speak('rei','summon')),false,
              'Uma fala tocou com as vozes desligadas');
            await page.locator('#lobbyVoice').click();

            const originalAudio=await page.evaluate(()=>window.CercoAudio?.status());
            assert.ok(originalAudio?.original===true,'Motor original Khar Tall não ativado');
            assert.equal(originalAudio.recordings,19,'Sons Khar Tall de ataques e movimentos não foram carregados');
            assert.deepEqual(originalAudio.allowedEvents,['attack','damage','victory'],'Política de sons do Cerco não corresponde à aprovada');
            const originalFiles=await page.evaluate(async()=>{
              const names=['arqueiro_disparo.wav','arqueiro_impacto.wav',
                'soldado_espada_corte.wav','soldado_espadas_choque_nitido.wav',
                'colosso_esmagamento_rachadura.wav','colosso_passo_estrondoso.wav','lobo_mordida_impacto.wav',
                'guardiao_ventania_magica.wav','rei_ataque_explosao.wav'];
              return await Promise.all(names.map(async name=>{
                const response=await fetch('/original-audio/'+name);
                const bytes=new Uint8Array(await response.arrayBuffer());
                const signature=String.fromCharCode(...bytes.slice(0,4));
                return {name,status:response.status,signature,bytes:bytes.length};
              }));
            });
            assert.ok(originalFiles.every(f=>f.status===200&&f.signature==='RIFF'&&f.bytes>10000),
              'Arquivos originais ausentes ou inválidos: '+JSON.stringify(originalFiles));

            // Som permitido: ataque, passo, dano, destruições e vitória.
            // Menu, invocação, interface, derrota e impactos duplicados silenciosos.
            const soundAudit=await page.evaluate(async()=>{
              const before=window.CercoAudio.played().length;
              const quiet=['ui','place','magic','impact','towerHit','defeat','wolfHowl','summon','music','step','towerDestroyed','castleDestroyed'];
              const results=quiet.map(kind=>window.CercoAudio.play(kind));
              const wolf=window.CercoAudio.play('wolf',{card:'lobo'});
              await new Promise(resolve=>setTimeout(resolve,120));
              const tower=window.CercoAudio.play('tower',{side:'ally'});
              const step=window.CercoAudio.play('step',{card:'colosso'});
              const invalidStep=window.CercoAudio.play('step',{card:'lobo'});
              const damage=window.CercoAudio.play('damage',{side:'ally'});
              const towerDestroyed=window.CercoAudio.play('towerDestroyed',{side:'enemy',lane:0});
              const castleDestroyed=window.CercoAudio.play('castleDestroyed',{side:'enemy'});
              const victory=window.CercoAudio.play('victory');
              return {before,results,wolf,tower,step,invalidStep,damage,towerDestroyed,castleDestroyed,victory,log:window.CercoAudio.played()};
            });
            assert.ok(soundAudit.results.every(x=>x===false),'Som de menu ou evento proibido não foi bloqueado');
            assert.equal(soundAudit.step,false,'Passos foram mantidos no áudio');
            assert.equal(soundAudit.invalidStep,false,'Passo do Colosso tocou em outra classe');
            assert.ok(['wolf','tower','damage','victory'].every(kind=>soundAudit[kind]),
              'Uma categoria de som permitida não funcionou');
            assert.deepEqual(soundAudit.log.slice(soundAudit.before).map(x=>x.sample),
              ['wolfBite','arrowLaunch','swordImpact','royalVictory'],
              'Sons originais de mordida, flecha, passo, ferimento, destruição e vitória não foram vinculados');
            assert.ok(soundAudit.log.every(x=>!x.sample.toLowerCase().includes('howl')),'Uivo permaneceu no jogo');

            await page.locator('#lobbySound').click();
            const muted=await page.evaluate(()=>window.CercoAudio.getSettings());
            assert.equal(muted.on,false,'Botao nao silencia som');
            await page.locator('#lobbySound').click();

            assert.equal(await page.locator('.game-nav button').count(),6);
            const tabs=['home','arena','cards','shop','clans','profile'];
            for(const tab of tabs){
              await page.locator('#navigation [data-view="'+tab+'"]').click();
              assert.equal(await page.locator('.page.active').getAttribute('data-page'),tab);
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);
              assert.ok(overflow<=2,'overflow '+tab+': '+overflow);
            }
            await page.locator('#navigation [data-view="shop"]').click();
            assert.equal(await page.locator('#shopGrid .shop-item').count(),8);
            await page.evaluate(()=>window.CercoStore.sync());
            assert.equal(await page.locator('#shopGrid .shop-item .swatch').count(),8,'A atualização da coleção apagou as skins');
            assert.equal(await page.locator('#shopGrid .shop-item strong').count(),8,'Nomes das skins foram apagados');
            assert.match(await page.locator('#shopStatus').innerText(),/TODOS PODEM COMPRAR/i);
            const buyUrl=await page.locator('#shopGrid .shop-item').nth(2).getAttribute('href');
            assert.equal(buyUrl,'#shop','Link da loja oficial não disponível para qualquer jogador');
            assert.match(await page.locator('#shopGrid .shop-item').nth(2).innerText(),/COMPRAR.*R\$ 2,50/i);
            assert.ok(await page.locator('#shopGrid .shop-item').nth(2).getAttribute('data-cerco-buy'),'Compra não pertence à loja própria');
            assert.equal(await page.locator('#featuredCards button').count(),8);
            await page.locator('#featuredCards button').first().click();
            assert.equal(await page.locator('.page.active').getAttribute('data-page'),'cards');
            assert.match(await page.locator('#cardName').innerText(),/Liliti/i);
            await page.waitForFunction(()=>{
              const art=document.getElementById('fullArt');
              return art?.complete&&art.naturalWidth>0&&art.src.includes('portrait_lilith_ruiva.webp');
            },null,{timeout:15000});
            const img=await page.locator('#fullArt').evaluate(e=>e.complete&&e.naturalWidth>0);
            assert.ok(img,'Imagem Liliti nao carregou');
            // O botão principal do lobby deve entrar diretamente na batalha,
            // sem abrir uma segunda página ou exigir outro toque.
            await page.locator('#navigation [data-view="home"]').click();
            await page.locator('#homePlay').click();
            await page.waitForFunction(()=>document.body.classList.contains('battle-mode'),{timeout:6000});
            const fullscreenView=await page.evaluate(()=>{
              const stage=document.querySelector('#battleStage').getBoundingClientRect(),
                    arena=document.querySelector('.canvas-box').getBoundingClientRect(),
                    hand=document.querySelector('.hand-box').getBoundingClientRect();
              return {stage:{x:stage.x,y:stage.y,w:stage.width,h:stage.height},
               arena:{w:arena.width,h:arena.height,top:arena.top,bottom:arena.bottom},
               hand:{top:hand.top,bottom:hand.bottom},
               viewport:{w:innerWidth,h:innerHeight},
               hasNative:!!document.fullscreenElement};
            });
            assert.ok(fullscreenView.stage.w>=fullscreenView.viewport.w-3,'Batalha nao ocupa toda largura');
            assert.ok(fullscreenView.stage.h>=fullscreenView.viewport.h-3,'Batalha nao ocupa toda altura');
            assert.ok(fullscreenView.arena.h>=fullscreenView.viewport.h*.5,'Arena nao ocupa espaco principal');
            assert.ok(fullscreenView.hand.bottom<=fullscreenView.viewport.h+4,'Cartas fora da tela');
            assert.ok(!(await page.locator('.game-header').isVisible()),'Barra do site permaneceu na partida');
            assert.ok(!(await page.locator('#navigation').isVisible()),'Menu do site nao deve aparecer na partida');
            assert.ok(await page.locator('#battleBack').isVisible(),'Voltar nao aparece');
            assert.ok(await page.locator('#battlePause').isVisible(),'Pausar nao aparece');
            assert.ok(await page.locator('#battleVoice').isVisible(),'Controlador de falas nao aparece na partida');
            // Mana em dez cristais separados, sem barra contínua e sem
            // acender frações do próximo bloco durante a recarga.
            const mana=await page.evaluate(()=>{
              const before=window.__cercoTest.mana();
              window.__cercoTest.setMana(6.95);
              const partial=window.__cercoTest.mana();
              const children=document.querySelectorAll('#manaBlocks .mana-block');
              const styles=getComputedStyle(document.querySelector('#manaBlocks'));
              window.__cercoTest.setMana(9.99);
              const almost=window.__cercoTest.mana();
              window.__cercoTest.setMana(10);
              const full=window.__cercoTest.mana();
              window.__cercoTest.setMana(6);
              return {before,partial,almost,full,count:children.length,
                layout:styles.display,columns:styles.gridTemplateColumns.split(' ').length,
                text:document.querySelector('#energy').textContent};
            });
            assert.equal(mana.count,10,'Mana precisa ter exatamente 10 blocos individuais');
            assert.equal(mana.layout,'grid','Mana precisa ser um grid de blocos');
            assert.equal(mana.columns,10,'Mana não possui dez colunas');
            assert.equal(mana.partial.ui,6,'A mana fracionada acendeu o próximo bloco');
            assert.equal(mana.almost.ui,9,'Mana fracionada acendeu o décimo bloco');
            assert.equal(mana.full.ui,10,'Mana máxima não acendeu os dez blocos');
            assert.equal(mana.text,'6 / 10 MANA','Indicador numérico de mana inválido');

            await page.locator('#battlePause').click();
            assert.ok(await page.locator('#overlay').isVisible(),'Pausa nao mostrou painel');
            await page.locator('#battlePause').click();
            assert.equal(await page.locator('#overlay').isVisible(),false,'Pausa nao voltou ao jogo');
            await page.waitForTimeout(1300);
            // Invocar Lobo para verificar sprite humano/animal completo (nao token circular).
            await page.locator('#arena').click({position:{x:100,y:330}});
            await page.waitForTimeout(550);
            const okSprite=await page.evaluate(()=>[...document.images].filter(x=>x.src.includes('/sprites/')).length);
            const imagesReady=await page.evaluate(async()=>{const ids=['lobo','rei','liliti'];return await Promise.all(ids.map(id=>new Promise(resolve=>{const img=new Image();img.onload=()=>resolve(img.naturalWidth>0);img.onerror=()=>resolve(false);img.src='/sprites/sprite_'+id+'.png'})))});
            assert.ok(imagesReady.every(Boolean),'Sprite PNG nao carregou');
            // O rio bloqueia o deslocamento: nenhuma trajetória atravessa fora das pontes.
            for(const scenario of [
              [35,445,376,95,0],
              [376,405,40,115,1],
              [205,460,205,65,0],
              [44,93,350,467,1]
            ]){
              const path=await page.evaluate(v=>window.__cercoTest.traceRoute(...v),scenario);
              const points=path.points,lo=path.riverTop,hi=path.riverBottom;
              assert.ok(points.length>35,'Rota nao calculada');
              const inWater=points.filter(p=>p.y>lo&&p.y<hi);
              assert.ok(inWater.length>0,'Tropa nao chegou a atravessar a ponte');
              assert.ok(inWater.every(p=>path.bridges.some(b=>Math.abs(p.x-b)<=path.bridgeHalfWidth)),
