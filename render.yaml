services:
  - type: web
    name: khar-tall-online
    runtime: node
    plan: free
    region: virginia
    buildCommand: node deploy-restore.js && node --check server.js && node --check engine.js && node --check online.js
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /tmp/khar-tall.sqlite3
      - key: TRUST_PROXY
        value: 'true'
      - key: DATA_PERSISTENT
        value: 'false'
      - key: ENABLE_ACCOUNT_REGISTRATION
        value: 'false'
