services:
  - type: web
    name: khar-tall-online
    runtime: node
    plan: free
    region: virginia
    buildCommand: node deploy-restore.js
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: 'true'
      - key: ENABLE_ACCOUNT_REGISTRATION
        value: 'true'
      - key: ACCOUNTS_DATABASE_URL
        sync: false
